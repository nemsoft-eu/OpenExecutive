name: Claude Code Review

# THROWAWAY DIAGNOSTIC COPY: never merge. Runs the real action with the real
# inputs but a trivial prompt, then prints only a few fields of the action's
# own execution output.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Review the PR
        id: run1
        continue-on-error: true
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Reply OK.
          claude_args: |
            --allowedTools "Read"

      - name: Print run 1 outcome
        if: always()
        shell: bash
        run: |
          echo "step outcome: ${{ steps.run1.outcome }}"
          F=/home/runner/work/_temp/claude-execution-output.json
          if [ ! -f "$F" ]; then echo "no execution output file"; exit 0; fi
          jq -r '(if type=="array" then .[] else . end)
            | if .type=="system" and .subtype=="init" then "init: apiKeySource=\(.apiKeySource) model=\(.model) cli=\(.claude_code_version)"
              elif .type=="result" then "result: subtype=\(.subtype) is_error=\(.is_error) text=\((.result // "") | tostring | .[0:300])"
              elif .type=="assistant" then ((.message.content // []) | map(select(.type=="text") | .text) | join(" ")) as $t | (if ($t | startswith("API Error")) then "assistant: \($t | .[0:300])" else empty end)
              else empty end' "$F" || echo "(could not parse execution output)"
          rm -f "$F"

      - name: Review the PR (haiku)
        id: run2
        continue-on-error: true
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Reply OK.
          claude_args: |
            --model claude-haiku-5-5
            --allowedTools "Read"

      - name: Print run 2 outcome
        if: always()
        shell: bash
        run: |
          echo "step outcome: ${{ steps.run2.outcome }}"
          F=/home/runner/work/_temp/claude-execution-output.json
          if [ ! -f "$F" ]; then echo "no execution output file"; exit 0; fi
          jq -r '(if type=="array" then .[] else . end)
            | if .type=="system" and .subtype=="init" then "init: apiKeySource=\(.apiKeySource) model=\(.model) cli=\(.claude_code_version)"
              elif .type=="result" then "result: subtype=\(.subtype) is_error=\(.is_error) text=\((.result // "") | tostring | .[0:300])"
              elif .type=="assistant" then ((.message.content // []) | map(select(.type=="text") | .text) | join(" ")) as $t | (if ($t | startswith("API Error")) then "assistant: \($t | .[0:300])" else empty end)
              else empty end' "$F" || echo "(could not parse execution output)"
          rm -f "$F"
